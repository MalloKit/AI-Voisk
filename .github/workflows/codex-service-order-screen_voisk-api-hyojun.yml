name: Build and deploy Python app to Azure Web App - voisk-api-hyojun

on:
  push:
    branches:
      - 'codex/service-order-screen'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: server
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload server files
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            server/
            !server/antenv/
            !server/.venv/
            !server/__pycache__/
            !server/.env
            !server/.env.*

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download server files
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_25C029E2B0A74CA0801191EDECC1AEB6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_34BC550078774D879ECD75E30C8682B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5C5F7F2BABA64105A61EAF200E8C71CF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'voisk-api-hyojun'
          slot-name: 'Production'
          package: .
